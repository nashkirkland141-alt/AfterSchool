<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101712"><title>AfterSchool</title><style>
:root{--bg:#0b120f;--panel:rgba(10,22,17,.84);--panel2:rgba(20,39,29,.82);--line:rgba(170,220,190,.12);--text:#edf5ef;--muted:#9aafa2;--accent:#77d4a2;--shadow:0 16px 50px #0008}*{box-sizing:border-box}body{margin:0;background:#07100b;color:var(--text);font:14px/1.45 Inter,system-ui,Segoe UI,Arial,sans-serif;min-height:100vh;background-image:linear-gradient(#06110dcc,#06110dcc),url('mountains.jpg');background-size:cover;background-position:center;background-attachment:fixed}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100vh;display:flex}.rail{width:64px;position:fixed;inset:0 auto 0 0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:9px;padding:15px 8px;background:rgba(5,14,10,.8);backdrop-filter:blur(18px);border-right:1px solid var(--line)}.brand-mini{font-weight:900;color:var(--accent);font-size:18px;margin:4px 0 18px}.navbtn{width:42px;height:42px;border:0;border-radius:13px;background:transparent;color:#9eb6a7;font-size:18px}.navbtn:hover,.navbtn.active{background:#234333;color:#b9f4d0}.navspacer{flex:1}.main{width:calc(100% - 64px);margin-left:64px;padding:24px clamp(14px,3vw,38px) 90px}.top{display:flex;align-items:center;gap:14px;max-width:1500px;margin:0 auto 20px}.wordmark{font-weight:900;letter-spacing:-1.5px;font-size:22px}.wordmark span{color:var(--accent)}.search{margin-left:auto;width:min(520px,58vw);background:#0d1a13cc;border:1px solid var(--line);border-radius:30px;padding:11px 17px;color:var(--text);outline:none}.search:focus{border-color:var(--accent)}.page{max-width:1500px;margin:auto}.hero{min-height:230px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(90deg,#06130de8,#06130d55),url('clouds.jpg') center/cover;display:flex;align-items:end;padding:clamp(22px,5vw,48px);box-shadow:var(--shadow);margin-bottom:22px}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1;margin:0 0 10px;letter-spacing:-2px}.hero p{color:#d0e3d5;margin:0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 13px}.section-head h2{margin:0;font-size:20px}.sub{color:var(--muted);font-size:12px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}.chip,.action{border:1px solid var(--line);background:#102018d9;border-radius:999px;padding:8px 13px;color:#c4d8ca}.chip.active,.action.primary{background:#28543d;border-color:#4b8e68;color:#effff4}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}.game{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#183426ed,#0c1711ed);transition:.18s;box-shadow:0 8px 22px #0003}.game:hover{transform:translateY(-3px);border-color:#72c99a88}.thumb{height:105px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#4a9a6b,#12251a 70%);font-size:34px;font-weight:900;color:#e1f8e9;text-shadow:0 3px 15px #0008;overflow:hidden}.game:nth-child(4n+2) .thumb{background:radial-gradient(circle at 70% 20%,#a17a49,#302316)}.game:nth-child(4n+3) .thumb{background:radial-gradient(circle at 50% 30%,#477a9a,#101e2a)}.game:nth-child(4n+4) .thumb{background:radial-gradient(circle at 40% 20%,#8063a4,#251b35)}.gamebody{padding:10px}.game-title{font-size:12px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.game-actions{display:flex;gap:7px;margin-top:9px}.tiny{border:1px solid var(--line);background:#1a3023;border-radius:8px;padding:6px 9px;font-size:11px}.empty{padding:38px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:18px;backdrop-filter:blur(18px);box-shadow:var(--shadow)}.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.wall{height:120px;border-radius:13px;background-size:cover;background-position:center;border:2px solid transparent}.wall.selected{border-color:var(--accent)}.wallname{margin-top:7px;font-size:12px}.setting-card{padding:12px;border:1px solid var(--line);border-radius:15px;background:#0e1b14b8}.musicbar{position:fixed;z-index:30;left:64px;right:0;bottom:0;background:#07110deF;border-top:1px solid var(--line);backdrop-filter:blur(20px);padding:10px 18px;display:flex;align-items:center;gap:12px}.musicbar audio{width:min(500px,60vw);height:32px}.musicbar .now{min-width:90px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.field{width:100%;background:#08130d;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);margin:6px 0 12px}.player{position:fixed;z-index:50;inset:0;background:#020805ed;display:none;flex-direction:column;padding:12px}.player.open{display:flex}.playerhead{display:flex;align-items:center;gap:10px;padding:4px 0 12px}.playerhead strong{flex:1}.player iframe{width:100%;height:calc(100% - 48px);border:1px solid var(--line);border-radius:12px;background:#000}.toast{position:fixed;bottom:78px;right:18px;padding:11px 16px;background:#244b35;border:1px solid #6bc18e;border-radius:12px;display:none;z-index:80}.toast.show{display:block}.mobile-label{display:none}
@media(max-width:700px){.rail{width:52px;padding:12px 5px}.navbtn{width:40px;height:40px}.main{margin-left:52px;width:calc(100% - 52px);padding:14px 10px 100px}.top{gap:8px}.wordmark{font-size:18px}.search{width:48vw;padding:9px 12px}.hero{min-height:180px;padding:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.thumb{height:90px}.gamebody{padding:8px}.game-title{font-size:11px}.musicbar{left:52px;padding:8px 10px;gap:7px}.musicbar .now{min-width:58px;font-size:10px}.musicbar audio{width:calc(100% - 75px)}.brand-mini{font-size:15px}.mobile-label{display:none}}
</style></head><body><div class="app"><aside class="rail"><div class="brand-mini">A.</div><button class="navbtn active" data-page="home" title="Study">⌂</button><button class="navbtn" data-page="games" title="Games">🎮</button><button class="navbtn" data-page="music" title="Music">♫</button><button class="navbtn" data-page="settings" title="Settings">⚙</button><div class="navspacer"></div><button class="navbtn" id="focusQuick" title="Focus timer">◷</button></aside><main class="main"><header class="top"><div class="wordmark">After<span>School</span></div><input id="globalSearch" class="search" placeholder="Search games..." autocomplete="off"></header><div id="view" class="page"></div></main></div><div class="musicbar"><div class="now" id="trackName">No track selected</div><audio id="audio" controls></audio><label class="tiny" for="musicUpload">＋ Music</label><input id="musicUpload" type="file" accept="audio/*" multiple hidden></div><div id="player" class="player"><div class="playerhead"><strong id="playingTitle">Game</strong><button class="action" id="fullscreen">Fullscreen</button><button class="action" id="closePlayer">✕ Close</button></div><iframe id="gameFrame" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe></div><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const $=s=>document.querySelector(s);let allGames=[],page='home',filter='All',musicFiles=[],musicIndex=0;const view=$('#view');
const wallpaperList=[['mountains.jpg','Mountain meadow'],['clouds.jpg','Sunset clouds'],['water.jpg','Forest water'],['beach.jpg','Tropical beach']];
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2300)}
function setPage(p){page=p;document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#globalSearch').style.display=p==='games'?'block':'none';render()}
document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));
function openGame(g){$('#playingTitle').textContent=g.title;$('#gameFrame').src=g.file;$('#player').classList.add('open')}
$('#closePlayer').onclick=()=>{$('#player').classList.remove('open');$('#gameFrame').src='about:blank'};$('#fullscreen').onclick=()=>{let f=$('#gameFrame');if(f.requestFullscreen)f.requestFullscreen()};
function gameCard(g){let d=document.createElement('article');d.className='game';let thumb=document.createElement('div');thumb.className='thumb';thumb.textContent=(g.title.match(/[A-Z0-9]/i)||['A'])[0].toUpperCase();let b=document.createElement('div');b.className='gamebody';let t=document.createElement('div');t.className='game-title';t.textContent=g.title;let actions=document.createElement('div');actions.className='game-actions';let play=document.createElement('button');play.className='tiny';play.textContent='▶ Play';play.onclick=()=>openGame(g);let fav=document.createElement('button');fav.className='tiny';fav.textContent=(JSON.parse(localStorage.getItem('as-favs')||'[]').includes(g.id)?'♥':'♡');fav.onclick=()=>{let a=JSON.parse(localStorage.getItem('as-favs')||'[]');a=a.includes(g.id)?a.filter(x=>x!==g.id):[...a,g.id];localStorage.setItem('as-favs',JSON.stringify(a));fav.textContent=a.includes(g.id)?'♥':'♡'};actions.append(play,fav);b.append(t,actions);d.append(thumb,b);return d}
function renderGames(target,items){target.innerHTML='';if(!items.length){target.innerHTML='<div class="empty">No games found. Try another search.</div>';return}let grid=document.createElement('div');grid.className='grid';items.forEach(g=>grid.append(gameCard(g)));target.append(grid)}
function home(){view.innerHTML=`<section class="hero"><div><h1>Make yourself<br>at home.</h1><p>Your games, music and quiet corner of the internet.</p><div class="chips"><button class="chip" data-go="games">🎮 Browse games</button><button class="chip" data-go="music">♫ Open music</button><button class="chip" data-go="settings">✦ Change scenery</button></div></div></section><div class="section-head"><h2>Jump back in</h2><span class="sub">${allGames.length.toLocaleString()} games loaded</span></div><div id="homeGames"></div><div class="section-head"><h2>Your space</h2></div><div class="settings-grid"><div class="panel"><h3>◷ Focus timer</h3><p class="sub">A little focus goes a long way.</p><div id="timerDisplay" style="font-size:30px;font-weight:800;margin:14px 0">25:00</div><button class="action primary" id="startTimer">Start focus</button> <button class="action" id="resetTimer">Reset</button></div><div class="panel"><h3>Quick note</h3><textarea id="quickNote" class="field" rows="4" placeholder="Write something down...">${(localStorage.getItem('as-note')||'').replace(/</g,'&lt;')}</textarea><button class="action primary" id="saveNote">Save note</button></div></div>`;
$('#homeGames').innerHTML='';renderGames($('#homeGames'),allGames.slice(0,12));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setPage(b.dataset.go));wireTimer();$('#quickNote').oninput=e=>localStorage.setItem('as-note',e.target.value);$('#saveNote').onclick=()=>toast('Note saved on this device')}
function gamesPage(){view.innerHTML=`<div class="section-head"><div><h2>Game library</h2><div class="sub">${allGames.length.toLocaleString()} games included · search, pick, play</div></div><label class="action" for="gameImport">＋ Import HTML</label><input id="gameImport" type="file" accept=".html,.htm,.zip" multiple hidden></div><div class="chips"><button class="chip active" data-filter="All">All games</button><button class="chip" data-filter="Favorites">♥ Favorites</button><button class="chip" data-filter="Recently added">Recently added</button></div><div id="gamesResults"></div>`;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));drawGameResults()});$('#gameImport').onchange=importGames;drawGameResults()}
function drawGameResults(){let q=$('#globalSearch').value.toLowerCase().trim();let list=allGames.filter(g=>g.title.toLowerCase().includes(q));if(filter==='Favorites'){let fav=JSON.parse(localStorage.getItem('as-favs')||'[]');list=list.filter(g=>fav.includes(g.id))}if(filter==='Recently added')list=list.slice(-60).reverse();renderGames($('#gamesResults'),list.slice(0,500));if(list.length>500)$('#gamesResults').insertAdjacentHTML('beforeend',`<p class="sub">Showing first 500 matches. Refine your search to narrow it down.</p>`)}
async function importGames(e){for(const f of e.target.files){if(f.name.toLowerCase().endsWith('.zip')){if(!window.JSZip){toast('ZIP importer needs an internet connection to load its helper');continue}try{let z=await JSZip.loadAsync(f);let count=0;for(const [path,obj] of Object.entries(z.files)){if(!obj.dir&&/\.html?$/i.test(path)){let blob=await obj.async('blob');let url=URL.createObjectURL(blob);allGames.push({title:obj.name.split('/').pop().replace(/\.html?$/i,'').replace(/[_-]/g,' '),file:url,id:'import-'+Date.now()+'-'+count++});}}toast('Imported '+count+' HTML games from ZIP')}catch(err){toast('Could not read that ZIP')}}else{let url=URL.createObjectURL(f);allGames.push({title:f.name.replace(/\.html?$/i,'').replace(/[_-]/g,' '),file:url,id:'import-'+Date.now()+'-'+Math.random()});toast('Imported '+f.name)}}drawGameResults();e.target.value=''}
function musicPage(){view.innerHTML=`<div class="section-head"><div><h2>Music</h2><div class="sub">Add audio from your device using the player below.</div></div><label class="action primary" for="musicUpload">＋ Add music</label></div><div class="panel"><h3>Your local library</h3><div id="musicList" class="settings-grid"></div><p class="sub">Audio files stay on your device. They are not uploaded anywhere.</p></div>`;drawMusic()}
function drawMusic(){let x=$('#musicList');if(!x)return;x.innerHTML='';if(!musicFiles.length){x.innerHTML='<div class="empty">No music added yet. Use “＋ Music” in the bottom player bar.</div>';return}musicFiles.forEach((f,i)=>{let d=document.createElement('div');d.className='setting-card';d.innerHTML=`<strong>${f.name.replace(/[<>&]/g,'')}</strong><p class="sub">Local audio file</p>`;let b=document.createElement('button');b.className='action';b.textContent='▶ Play';b.onclick=()=>playMusic(i);d.append(b);x.append(d)})}
function playMusic(i){musicIndex=i;$('#audio').src=URL.createObjectURL(musicFiles[i]);$('#trackName').textContent=musicFiles[i].name;$('#audio').play().catch(()=>{});drawMusic()}
$('#musicUpload').onchange=e=>{musicFiles.push(...Array.from(e.target.files));if(musicFiles.length===e.target.files.length)playMusic(0);else drawMusic();e.target.value=''};
function settingsPage(){view.innerHTML=`<div class="section-head"><div><h2>Settings</h2><div class="sub">Make AfterSchool feel like yours.</div></div></div><div class="panel"><h3>Background gallery</h3><p class="sub">Choose one of your supplied relaxing wallpapers.</p><div class="settings-grid" id="walls"></div><div style="margin-top:18px"><label class="action" for="wallUpload">Upload your own background</label><input type="file" id="wallUpload" accept="image/*" hidden></div></div><div class="panel" style="margin-top:15px"><h3>Appearance</h3><label class="sub">Accent color</label><input id="accent" type="color" value="${localStorage.getItem('as-accent')||'#77d4a2'}" class="field" style="height:48px;padding:5px"><button id="resetSettings" class="action">Reset appearance</button></div><div class="panel" style="margin-top:15px"><h3>About</h3><p class="sub">AfterSchool · A personal browser hub. Your game catalog is stored locally in this project folder.</p></div>`;let walls=$('#walls');wallpaperList.forEach(([file,name])=>{let d=document.createElement('div');d.innerHTML=`<div class="wall" style="background-image:url('${file}')"></div><div class="wallname">${name}</div>`;d.style.cursor='pointer';d.onclick=()=>setWallpaper(file);walls.append(d)});$('#accent').oninput=e=>{document.documentElement.style.setProperty('--accent',e.target.value);localStorage.setItem('as-accent',e.target.value)};$('#wallUpload').onchange=e=>{let f=e.target.files[0];if(f){let u=URL.createObjectURL(f);document.body.style.backgroundImage=`linear-gradient(#06110d99,#06110d99),url('${u}')`;toast('Background applied for this session')}};$('#resetSettings').onclick=()=>{localStorage.removeItem('as-accent');document.documentElement.style.setProperty('--accent','#77d4a2');setWallpaper('mountains.jpg');toast('Appearance reset')}}
function setWallpaper(file){document.body.style.backgroundImage=`linear-gradient(#06110dcc,#06110dcc),url('${file}')`;localStorage.setItem('as-wallpaper',file);document.querySelectorAll('.wall').forEach((w,i)=>w.classList.toggle('selected',wallpaperList[i][0]===file))}
let timer=null,seconds=1500;function timerText(){let e=$('#timerDisplay');if(e)e.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}function wireTimer(){timerText();$('#startTimer').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('#startTimer').textContent='Resume focus';return}$('#startTimer').textContent='Pause';timer=setInterval(()=>{seconds=Math.max(0,seconds-1);timerText();if(!seconds){clearInterval(timer);timer=null;toast('Focus session complete!');$('#startTimer').textContent='Start focus'}},1000)};$('#resetTimer').onclick=()=>{clearInterval(timer);timer=null;seconds=1500;timerText();$('#startTimer').textContent='Start focus'}}
function render(){if(page==='home')home();if(page==='games')gamesPage();if(page==='music')musicPage();if(page==='settings')settingsPage()}
fetch('games.json').then(r=>r.json()).then(g=>{allGames=g;render()}).catch(()=>{view.innerHTML='<div class="empty">Could not load games.json. Keep the games.json file beside index.html.</div>'});$('#globalSearch').oninput=()=>{if(page!=='games')setPage('games');else drawGameResults()};$('#focusQuick').onclick=()=>{setPage('home');setTimeout(()=>$('#startTimer')?.click(),100)};let savedAccent=localStorage.getItem('as-accent');if(savedAccent)document.documentElement.style.setProperty('--accent',savedAccent);let savedWall=localStorage.getItem('as-wallpaper');if(savedWall)setWallpaper(savedWall);
</script></body></html>
